<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Music data app</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/script.mjs"></script>
  </head>
  <body>
    <main>
      <h1>Welcome to your music report!</h1>
      <div style="display: flex; gap: 10px">
        <form id="loginForm">
          <label for="userSelector">Showing data for user number:</label>
          <select required id="userSelector">
            <option value="" disabled selected>Please select a user</option>
          </select>
          <button id="loginButton" type="submit">Read data</button>
        </form>
      </div>

      <div id="dataDisplay"></div>

      <template id="reportTemplate">
        <section>
          <h2>
            What was the user's most often listened to song according to the
            data?
          </h2>
          <p data-result="most-listened-song">No data to display</p>
        </section>

        <section>
          <h2>
            What was the user's most often listened to artist according to the
            data?
          </h2>
          <p data-result="most-listened-artist">No data to display</p>
        </section>

        <section>
          <h2>
            What was the user's most often listened to song on Friday nights by
            number of listens (between 5pm and 4am)?
          </h2>
          <p data-result="most-listened-song-on-friday-count">
            No data to display
          </p>
        </section>

        <section>
          <h2>
            What song did the user listen to for the most total time?
          </h2>
          <p data-result="most-listened-by-seconds">No data to display</p>
        </section>

        <section>
          <h2>What artist did the user listen to for the most total time?</h2>
          <p data-result="most-listened-artist-by-seconds">
            No data to display
          </p>
        </section>

        <section>
          <h2>
            What was the user's most listened-to song on Friday nights by total
            listening time (between 5pm and 4am)?
          </h2>
          <p data-result="most-listened-song-on-friday-by-seconds">
            No data to display
          </p>
        </section>

        <section>
          <h2>
            What song did the user listen to consecutively for the longest
            period?
          </h2>
          <p data-result="most-consecutive-listened">No data to display</p>
        </section>
      </template>
    </main>
  </body>
</html>
